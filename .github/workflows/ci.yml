name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: workflow/cli

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep the advertised Node 20 minimum covered alongside newer LTS lines.
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: workflow/cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and typecheck CLI
        run: npm run build

      - name: CLI and vendor workflow tests (vitest)
        run: npm exec -- vitest run --passWithNoTests=false

  # Preserve one stable required check regardless of the runtime matrix.
  gate:
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every runtime to pass
        working-directory: ${{ github.workspace }}
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" ]]; then
            echo "::error::CI checks did not all pass ($CHECKS_RESULT)."
            exit 1
          fi
