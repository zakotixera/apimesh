name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: workflow/cli

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep the advertised Node 20 minimum covered alongside newer LTS lines.
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: workflow/cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and run CLI and vendor workflow tests
        run: npm test

  # Preserve one stable required check regardless of the runtime matrix.
  gate:
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Require every runtime to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci.cjs gate
