name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: workflow/cli

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep the advertised Node 20 minimum covered alongside newer LTS lines.
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: workflow/cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and typecheck CLI
        run: npm run build

      - name: Unit tests (vitest)
        run: npm exec -- vitest run --passWithNoTests=false

      - name: Detect template or collection
        id: corpus
        run: |
          mode=$(node scripts/collection-mode.cjs)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Validate canonical
        if: steps.corpus.outputs.mode == 'collection'
        run: npm run apic -- validate

      - name: Check generated outputs and render stability
        if: steps.corpus.outputs.mode == 'collection'
        working-directory: ${{ github.workspace }}
        run: |
          for pass in 1 2; do
            npm --prefix workflow/cli run apic -- render --all
            # Unlike git diff alone, status also detects new generated files.
            changes=$(git status --porcelain=v1 --untracked-files=all -- dist/)
            if [[ -n "$changes" ]]; then
              echo "::error::dist/ is out of sync after render pass $pass. Run render --all, then commit the generated consumer artifacts."
              printf '%s\n' "$changes"
              git diff --stat -- dist/
              exit 1
            fi
          done

      - name: Postman regression
        if: steps.corpus.outputs.mode == 'collection'
        run: npm run apic -- test

  # Preserve one stable required check regardless of the runtime matrix.
  gate:
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every runtime to pass
        working-directory: ${{ github.workspace }}
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" ]]; then
            echo "::error::CI checks did not all pass ($CHECKS_RESULT)."
            exit 1
          fi
